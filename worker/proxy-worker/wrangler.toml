name = "googlr-proxy-worker"
main = "index.js"
compatibility_date = "2024-11-01"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

# Local dev — points at locally running lens-worker
[env.local.vars]
LENS_WORKER_URL = "http://localhost:8788"

# Production — points at deployed lens-worker
[env.production.vars]
LENS_WORKER_URL = "https://googlr-lens-worker-production.ojezlekan1234.workers.dev"
