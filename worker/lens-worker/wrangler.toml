
name = "googlr-lens-worker"
main = "index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

[browser]
binding = "BROWSER"

# Local dev override — mock mode on
[env.local.vars]
USE_MOCK = "true"

# Production — mock off
[env.production.vars]
USE_MOCK = "false"

# Production browser binding
[env.production.browser]
binding = "BROWSER"
